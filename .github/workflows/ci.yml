name: ci

on:
  push:
  pull_request:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust tests + build
        run: |
          cargo test --workspace
          cargo build --workspace
      - name: Frontend replay tests
        run: |
          node python/tests/replay.test.js
          node python/tests/drawings.test.js
          node python/tests/metrics_panel.test.js
          node python/tests/workspace.test.js
      - name: Studio frontend tests and production assets
        run: |
          npm ci --prefix studio
          npm test --prefix studio
          npm run build --prefix studio
      - name: Build wheel
        run: |
          python -m pip install maturin
          cd python && maturin build --release
      - name: Fresh-env Python package tests
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/pip install python/target/wheels/*.whl
          # Test-only dependency for the property-based trust checks.
          .ci-venv/bin/pip install "hypothesis>=6,<7"
          .ci-venv/bin/python python/tests/test_observa.py
          .ci-venv/bin/python python/tests/test_canonical_baseline.py
          .ci-venv/bin/python python/tests/test_annotations.py
          .ci-venv/bin/python python/tests/test_ai_interface.py
          .ci-venv/bin/python python/tests/test_onboarding_ai.py
      # OBS-DEMO-01: the bundled real EUR/USD demo dataset and strategy must work
      # offline — no network, no yfinance, no pandas.
      - name: Real-data demo dataset tests
        run: .ci-venv/bin/python python/tests/test_demo.py
      - name: Structured inspection tests
        run: .ci-venv/bin/python python/tests/test_inspection.py
      - name: Strategy reason schema tests
        run: .ci-venv/bin/python python/tests/test_strategy_reason.py
      # OBS-TRUST-01/02: silent intent loss at the Python boundary and
      # silently accepted market data must fail loudly (property-based).
      - name: Trust-boundary contract tests
        run: .ci-venv/bin/python python/tests/test_trust_boundary.py
      # OBS-TRUST-03 / issue #6: read-only O(1) history; byte-identical
      # economics vs the 0.1.6 golden digest; linear scaling (ratio gate).
      - name: History contract + scaling tests
        run: .ci-venv/bin/python python/tests/test_history_contract.py
      # No lookahead under future-bar perturbation; byte-identical reruns.
      - name: Causality and determinism tests
        run: .ci-venv/bin/python python/tests/test_causality.py
      # Independent Finance/QA golden ledgers (hand-computed expectations).
      - name: Golden ledgers (execution and accounting)
        run: .ci-venv/bin/python harness/finance/golden_ledgers.py
      # Metrics schema 2: hand-computed fixture + independent re-implementation
      # of every definition in docs/metrics.md; schema-1 runs still load.
      - name: Metrics fixtures (independent calculation)
        run: .ci-venv/bin/python python/tests/test_metrics_fixtures.py
      # OBS-AI-04: the agent authoring contract (bundled spec/guide/gold example,
      # the three-tier validator, the CLI surfaces and the generated docs) must
      # hold against the installed wheel. No extra dependency is needed.
      - name: Agent authoring contract tests
        run: .ci-venv/bin/python python/tests/test_agent_contract.py
      - name: Quickstart smoke (installed wheel)
        run: |
          mkdir -p .ci-out && cd .ci-out
          ../.ci-venv/bin/python ../examples/quickstart.py
      # OBS-MCP-01 / OBS-AI-05: the read-only MCP server (run inspection +
      # authoring discovery) lives behind the optional `mcp` extra, so it gets
      # its own venv. OBS-UX-02: MCP is now a normal dependency, so the PLAIN
      # wheel is installed here — if a plain install ever stopped providing MCP,
      # this gate would fail, which is exactly the one-install guarantee.
      - name: MCP server tests (plain wheel install)
        run: |
          WHEEL=$(ls python/target/wheels/*.whl | head -1)
          python -m venv .mcp-venv
          .mcp-venv/bin/pip install "${WHEEL}"
          .mcp-venv/bin/python -c "import mcp; print('mcp', mcp.__file__)"
          .mcp-venv/bin/python python/tests/test_mcp.py
      # The legacy `[mcp]` extra must keep resolving for existing scripts.
      - name: Legacy [mcp] extra still installs
        run: |
          WHEEL=$(ls python/target/wheels/*.whl | head -1)
          python -m venv .mcp-alias-venv
          .mcp-alias-venv/bin/pip install "${WHEEL}[mcp]"
          .mcp-alias-venv/bin/python -c "import mcp; print('legacy [mcp] alias OK')"
      - name: Studio sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu's runner may restrict unprivileged user namespaces. This
          # disposable CI VM needs them to test the real isolated worker.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net -- /bin/true
      - name: Installed Studio service and worker regressions
        run: |
          WHEEL=$(ls python/target/wheels/*.whl | head -1)
          .ci-venv/bin/pip install "${WHEEL}[studio]" httpx playwright
          .ci-venv/bin/python -m unittest discover -s python/tests -p 'test_studio*.py' -v
      - name: Studio browser regressions with real engine data
        run: |
          .ci-venv/bin/python -m playwright install --with-deps chromium
          .ci-venv/bin/python harness/studio_controls_review.py --chart-only --out .ci-studio-charts
          .ci-venv/bin/python harness/studio_stop_review.py --out .ci-studio-charts/stop
      - name: Retain Studio chart verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-chart-verification
          path: .ci-studio-charts
          if-no-files-found: ignore
