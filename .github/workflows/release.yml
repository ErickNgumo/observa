name: release-wheel

on:
  push:
    tags:
      - "observa-*"

# Creating the Release and uploading assets needs write access to repository
# contents. The default workflow token is read-only here, which made the
# release step fail while every earlier step (build, version check, baseline)
# succeeded. Scope the token to the minimum required.
permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve release version
        id: version
        # Single source of truth: the package version in python/pyproject.toml.
        # The tag must contain that version, so a mislabelled release fails
        # before anything is built or uploaded.
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          case "${GITHUB_REF_NAME}" in
            *"${VERSION}"*) ;;
            *)
              echo "::error::tag '${GITHUB_REF_NAME}' does not contain package version '${VERSION}' (from python/pyproject.toml)"
              exit 1
              ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version ${VERSION} from tag ${GITHUB_REF_NAME}"
      - name: Test + build wheel
        run: |
          cargo test --workspace
          python -m pip install maturin
          cd python && maturin build --release
      - name: Record SHA-256
        id: sha
        run: |
          WHEEL=$(ls python/target/wheels/*.whl | head -1)
          sha256sum "$WHEEL" | tee sha256.txt
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$(basename "$WHEEL")" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 sha256.txt)" >> "$GITHUB_OUTPUT"
      - name: Verify built wheel (deterministic canonical baseline)
        # A release must not be publishable if the canonical economics regressed.
        run: |
          python -m venv .release-venv
          .release-venv/bin/pip install python/target/wheels/*.whl
          .release-venv/bin/python -c "import observa;assert observa.__version__ == '${{ steps.version.outputs.version }}', observa.__version__"
          .release-venv/bin/python python/tests/test_canonical_baseline.py
      - name: Verify built wheel (annotations + deterministic identity)
        # OBS-AI-02 / OBS-DET-01 smoke checks. A release must not be publishable
        # if the annotation contract or deterministic position identity regressed.
        run: |
          .release-venv/bin/python python/tests/test_deterministic_identity.py
          .release-venv/bin/python python/tests/test_annotations.py
      - name: Verify built wheel (structured inspection)
        run: .release-venv/bin/python python/tests/test_inspection.py
      - name: Verify built wheel (strategy reasons)
        run: .release-venv/bin/python python/tests/test_strategy_reason.py
      - name: Verify built wheel (agent authoring contract)
        # OBS-AI-04: a release must not be publishable if the bundled strategy
        # authoring assets (spec.json, guide, gold example, AGENTS template)
        # drift or disappear, or if the validator/CLI surfaces regress. Uses the
        # existing base release venv — no extra dependency.
        run: .release-venv/bin/python python/tests/test_agent_contract.py
      - name: Verify built wheel (real-data demo dataset)
        # OBS-DEMO-01: the bundled real EUR/USD demo fixture and strategy are
        # shipped artifacts too. A release must not be publishable if the demo
        # dataset is missing, drifts from its recorded provenance, or no longer
        # runs without network/yfinance/pandas.
        run: .release-venv/bin/python python/tests/test_demo.py
      - name: Verify built wheel (MCP, one install)
        # OBS-MCP-01 / OBS-AI-05 / OBS-UX-02: the read-only MCP server (run
        # inspection + authoring discovery) ships in the *standard* wheel. A
        # release must not be publishable if a PLAIN install of the exact
        # artifact being published fails to provide MCP, or if the server
        # contract regressed. Its own venv keeps the base release venv
        # isolated from the MCP dependency tree.
        run: |
          python -m venv .release-mcp-venv
          .release-mcp-venv/bin/python -m pip install --upgrade pip
          WHEEL="${{ steps.sha.outputs.wheel }}"
          .release-mcp-venv/bin/python -m pip install "${WHEEL}"
          .release-mcp-venv/bin/python -c "import mcp; print('mcp', mcp.__file__)"
          .release-mcp-venv/bin/python python/tests/test_mcp.py
      - name: Verify the legacy [mcp] extra still installs
        # Existing testers' scripts use `<wheel>[mcp]`; it must keep resolving
        # (as an empty compatibility alias) even though it is never required.
        run: |
          python -m venv .release-mcp-alias-venv
          .release-mcp-alias-venv/bin/python -m pip install --upgrade pip
          WHEEL="${{ steps.sha.outputs.wheel }}"
          .release-mcp-alias-venv/bin/python -m pip install "${WHEEL}[mcp]"
          .release-mcp-alias-venv/bin/python -c "import mcp; print('legacy [mcp] alias OK')"
      - name: Create private-MVP GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Observa ${{ steps.version.outputs.version }} — Private MVP
          body: |
            Private-MVP tester wheel (Linux x86_64 / manylinux_2_34 / abi3 >= 3.10).

            Version: ${{ steps.version.outputs.version }}
            Tag: ${{ github.ref_name }}
            Wheel: ${{ steps.sha.outputs.wheel_name }}
            SHA-256: ${{ steps.sha.outputs.sha }}

            Install: python -m pip install "<wheel asset URL from this release>"
            Do NOT run bare `pip install observa` (unrelated PyPI project).
            Real-data example: python -m pip install yfinance pandas; python ema_observa.py
            Replay now selects a free port and prints the URL it bound.
            Docs: README.md, docs/getting-started.md, llms-full.txt
          files: |
            python/target/wheels/*.whl
            examples/quickstart.py
            examples/eurusd_demo.py
            examples/ema_observa.py
            examples/rsi_mean_reversion.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
