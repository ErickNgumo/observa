[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "observa"
version = "0.1.3"
description = "Deterministic event-driven backtesting engine — Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Observa" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

# Optional additive surfaces. The base package stays dependency-free: the
# `mcp` extra is only installed when a user explicitly asks for it, and nothing
# in observa/__init__.py imports it.
[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]

[tool.maturin]
module-name = "observa._observa"
python-source = "python"

[project.scripts]
observa = "observa.cli:main"
