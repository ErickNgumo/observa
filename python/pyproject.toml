[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "observa"
version = "0.1.0"
description = "Deterministic event-driven backtesting engine — Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Observa" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[tool.maturin]
module-name = "observa._observa"
python-source = "python"

[project.scripts]
observa = "observa.cli:main"
