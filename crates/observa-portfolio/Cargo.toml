[package]
name = "observa-portfolio"
version = "0.1.3"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
# `v5` is required for deterministic position ids (OBS-DET-01). `v4` remains
# for the run/session identity that does not reach persisted artifacts.
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
observa-core = { path = "../observa-core" }