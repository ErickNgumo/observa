[package]
name = "observa-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
observa-core = { path = "../observa-core" }
observa-portfolio = { path = "../observa-portfolio" }
observa-execution = { path = "../observa-execution" }
observa-metrics = { path = "../observa-metrics" }

[dev-dependencies]
tempfile = "3"
