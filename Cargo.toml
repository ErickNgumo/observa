[workspace]
members = [
    "crates/observa-core",
    "crates/observa-data",
    "crates/observa-engine",
    "crates/observa-execution",
    "crates/observa-portfolio",
    "crates/observa-python",
    "crates/observa-metrics",
    "crates/observa-cli",
    # Legacy prototype binaries (observa-runner, observa-server) are excluded
    # from workspace members because they no longer compile against the current
    # portfolio/strategy APIs and broke `cargo build/test --workspace`.
    # They are retired in OBS-0007; the directories are intentionally left in
    # place until then.
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors   = ["Observa"]
license   = "MIT"

[workspace.dependencies]
chrono     = { version = "0.4", features = ["serde"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.0", features = ["v4", "serde"] }
thiserror  = "1.0"
csv        = "1.3"
